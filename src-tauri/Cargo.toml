[package]
name = "agentos"
version = "2.1.0"
description = "AgentOS — local-first runtime for steerable coding agents"
authors = ["AgentOS Contributors"]
edition = "2021"

[lib]
name = "agentos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
rusqlite           = { version = "0.32", features = ["bundled"] }

[profile.release]
panic        = "abort"
codegen-units = 1
lto          = true
opt-level    = "s"
strip        = true
