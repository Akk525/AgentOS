<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9f1239" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06060a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#06060a"/>
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
  </g>

  <!-- Logo -->
  <rect x="80" y="80" width="48" height="48" rx="12" fill="#be123c"/>
  <circle cx="104" cy="104" r="10" fill="white"/>

  <!-- AgentOS wordmark -->
  <text x="148" y="97" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.5">AgentOS</text>
  <text x="148" y="117" font-family="ui-monospace, monospace" font-size="11" fill="#475569">v1.3.0-alpha</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Local-first runtime for</text>
  <text x="80" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#94a3b8" letter-spacing="-1.5">steerable coding agents.</text>

  <!-- Subheadline -->
  <text x="80" y="360" font-family="ui-monospace, monospace" font-size="18" fill="#475569">Supervise · Orchestrate · Understand · Control</text>

  <!-- Session indicators -->
  <g transform="translate(80, 410)">
    <!-- Session row 1 -->
    <circle cx="6" cy="8" r="4" fill="#22d3ee"/>
    <text x="18" y="12" font-family="ui-monospace, monospace" font-size="13" fill="#94a3b8">Cipher</text>
    <text x="80" y="12" font-family="ui-monospace, monospace" font-size="13" fill="#475569">fix/auth-race</text>
    <text x="240" y="12" font-family="ui-monospace, monospace" font-size="11" fill="#22d3ee">running</text>

    <!-- Session row 2 -->
    <circle cx="6" cy="30" r="4" fill="#a78bfa"/>
    <text x="18" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#94a3b8">Echo</text>
    <text x="80" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#475569">fix/auth-race</text>
    <text x="240" y="34" font-family="ui-monospace, monospace" font-size="11" fill="#a78bfa">reviewing</text>

    <!-- Session row 3 -->
    <circle cx="6" cy="52" r="4" fill="#34d399"/>
    <text x="18" y="56" font-family="ui-monospace, monospace" font-size="13" fill="#94a3b8">Atlas</text>
    <text x="80" y="56" font-family="ui-monospace, monospace" font-size="13" fill="#475569">test/payment-int</text>
    <text x="240" y="56" font-family="ui-monospace, monospace" font-size="11" fill="#22d3ee">running</text>

    <!-- Session row 4 -->
    <circle cx="6" cy="74" r="4" fill="#fbbf24"/>
    <text x="18" y="78" font-family="ui-monospace, monospace" font-size="13" fill="#94a3b8">Rex</text>
    <text x="80" y="78" font-family="ui-monospace, monospace" font-size="13" fill="#475569">refactor/parser-v2</text>
    <text x="240" y="78" font-family="ui-monospace, monospace" font-size="11" fill="#fbbf24">blocked</text>
  </g>

  <!-- Right: badges -->
  <g transform="translate(820, 410)">
    <rect width="300" height="38" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="12" fill="#475569">Orchestration · Planning · Reasoning</text>

    <rect y="50" width="300" height="38" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="16" y="74" font-family="ui-monospace, monospace" font-size="12" fill="#475569">Human controls · Blocker escalation</text>

    <rect y="100" width="300" height="38" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="16" y="124" font-family="ui-monospace, monospace" font-size="12" fill="#475569">Open source · Apache 2.0 · Local-first</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#ffffff" fill-opacity="0.015"/>
  <text x="80" y="611" font-family="ui-monospace, monospace" font-size="11" fill="#334155">github.com/your-org/agentos</text>
  <text x="1080" y="611" font-family="ui-monospace, monospace" font-size="11" fill="#334155">Apache 2.0</text>
</svg>
